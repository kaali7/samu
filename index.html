<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HB SAMU</title>
  <link href="./output.css" rel="stylesheet" />
  <!-- Google Font: Poppins + Pacifico -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    h1 {
      font-family: 'Pacifico', cursive;
    }

    @keyframes fall {
      0% {
        transform: translateY(-120px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.6;
      }
    }

    .sweet {
      position: absolute;
      top: -50px;
      animation-name: fall;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .sweet-1 { left: 5%; font-size: 1.5rem; animation-duration: 8s; animation-delay: 0s; }
    .sweet-2 { left: 15%; font-size: 2rem; animation-duration: 10s; animation-delay: 2s; }
    .sweet-3 { left: 30%; font-size: 1.8rem; animation-duration: 9s; animation-delay: 1.5s; }
    .sweet-4 { left: 45%; font-size: 2.2rem; animation-duration: 11s; animation-delay: 3s; }
    .sweet-5 { left: 60%; font-size: 1.6rem; animation-duration: 7s; animation-delay: 1s; }
    .sweet-6 { left: 75%; font-size: 2rem; animation-duration: 9s; animation-delay: 2.5s; }
    .sweet-7 { left: 90%; font-size: 1.4rem; animation-duration: 12s; animation-delay: 3.5s; }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0px rgba(255, 105, 180, 0.5); }
      50% { box-shadow: 0 0 20px rgba(255, 105, 180, 0.8); }
      100% { box-shadow: 0 0 0px rgba(255, 105, 180, 0.5); }
    }

    .animate-pulse-glow {
      animation: pulse-glow 2s infinite;
    }

    .gradient-text {
      background: linear-gradient(to right, #f472b6, #fb7185, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="bg-[#fcd0c3] overflow-hidden relative">

  <!-- Falling Sweets -->
  <div class="sweet sweet-1">🍫</div>
  <div class="sweet sweet-2">🍬</div>
  <div class="sweet sweet-3">🍭</div>
  <div class="sweet sweet-4">🧁</div>
  <div class="sweet sweet-5">🍩</div>
  <div class="sweet sweet-6">🍪</div>
  <div class="sweet sweet-7">🍰</div>

  <!-- Birthday Card -->
  <div class="flex justify-center items-center h-screen relative z-10">
    <div class="bg-[#FBDDCD] w-[22rem] p-8 m-5 rounded-2xl shadow-xl flex flex-col items-center gap-4 animate-fade-in">
      <h1 class="text-3xl font-bold text-center leading-tight gradient-text">
        Happy Birthday,<br />My Dear Siso 
      </h1>
      <div class="text-4xl">🎂💖🌸</div>
      <div class="flex gap-4">
        <a href="photo.html" class="mt-4 px-6 py-2 rounded-full text-white bg-gradient-to-r from-pink-500 via-pink-400 to-yellow-400 shadow-lg hover:scale-110 hover:shadow-xl transition-all duration-300 ease-in-out animate-pulse-glow">
          Click 
        </a>
        <a href="card.html" class="mt-4 px-6 py-2 rounded-full text-white bg-gradient-to-r from-pink-500 via-pink-400 to-yellow-400 shadow-lg hover:scale-110 hover:shadow-xl transition-all duration-300 ease-in-out animate-pulse-glow">
          letter
        </a>
      </div>      
    </div>
  </div>

</body>

</html>
