<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vintage Birthday Letter</title>
  <link href="./output.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Crimson+Text&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Crimson Text', serif;
    }

    .handwritten {
      font-family: 'Pacifico', cursive;
    }

    .paper {
      background: linear-gradient(145deg, rgba(251, 221, 205, 0.9), rgba(252, 208, 195, 0.9));
      background-blend-mode: overlay;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.1),
        inset 0 0 20px rgba(255, 255, 255, 0.5);
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 0;
      }

      50% {
        opacity: 1;
      }
    }

    .animate-blink {
      animation: blink 1s step-end infinite;
    }

    .letter-content {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(5px);
      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.05),
        0 0 10px rgba(0, 0, 0, 0.05);
    }

    .seal {
      position: absolute;
      bottom: -20px;
      right: -20px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #f87171, #dc2626);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;
      transform: rotate(15deg);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      border: 2px dashed rgba(255, 255, 255, 0.5);
    }

    .char {
      display: inline-block;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .char.visible {
      opacity: 1;
    }
  </style>
</head>

<body class="bg-[#fcd0c3] min-h-screen flex items-center justify-center p-4">
  <!-- <body class="bg-[#fcd0c3] min-h-screen flex items-center justify-center px-4 py-6"></body> -->

  <!-- Letter Container -->
  <div
    class="paper max-w-2xl w-full md:w-[500px] min-h-[550px] px-8 py-10 rounded-[30px] border border-white/70 relative overflow-hidden">

    <!-- Wax Seal -->
    <div class="seal handwritten">💌</div>

    <!-- Header -->
    <h1 class="text-4xl text-center text-pink-800 handwritten mb-8 drop-shadow-md"> Dearest Samu 🐥</h1>

    <!-- Typing Content -->
    <div
      class="letter-content rounded-xl px-8 py-6 font-serif text-lg leading-8 tracking-wide text-gray-800 min-h-[350px] max-h-[400px] overflow-y-auto">
      <div id="typedText" class="whitespace-pre-wrap italic"></div>
      <span id="cursor" class="text-pink-600 font-bold animate-blink text-xl">|</span>
    </div>

    <!-- Footer -->
    <div class="mt-6 text-center text-2xl text-pink-500/80">✧･ﾟ: *✧･ﾟ:*･ﾟ✧*:･ﾟ✧</div>

    <!-- Back button -->
    <a href="index.html"
      class="mt-4 px-6 py-2 rounded-full text-white bg-gray-950 shadow-lg hover:scale-110 hover:shadow-xl transition-all duration-300 ease-in-out animate-pulse-glow">
      Back
    </a>

  </div>

  <script>
    const message = `Samu,\n\nDekho ji, ishe bane me hi time laga gaya hai , tho jada likhungi nhi kyuki muje abhi deploy karne me bhi time lagega, bs yahi bolungi khush raho or rahne do durso ko muje bhi,devi tumpe kirpe karega , waise Happy Birthday 🐥💝 \n\nYours Achi wali Dost or Bahen malo,\nSiSo`;

  

    const typedText = document.getElementById("typedText");
    const cursor = document.getElementById("cursor");
    let charIndex = 0;
    let lineCount = 0;
    let isTyping = true;

    // First create all character spans (hidden)
    function prepareText() {
      for (let i = 0; i < message.length; i++) {
        const char = message[i];
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char === '\n' ? '\n' : char;
        typedText.appendChild(span);
      }
    }

    function typeNextChar() {
      if (charIndex < message.length) {
        const currentChar = typedText.children[charIndex];

        // Make the current character visible
        currentChar.classList.add('visible');

        // Special delays for certain characters
        let delay = 50; // Base typing speed

        // Longer pause after punctuation and line breaks
        if (/[.,—!\n]/.test(currentChar.textContent)) {
          delay += 150;
        }

        // Extra pause after paragraph breaks
        if (currentChar.textContent === '\n' && message[charIndex + 1] === '\n') {
          delay += 300;
        }

        // Scroll to keep current line visible
        if (currentChar.textContent === '\n') {
          lineCount++;
          if (lineCount > 3) {
            typedText.parentElement.scrollTop = typedText.parentElement.scrollHeight;
          }
        }

        charIndex++;
        setTimeout(typeNextChar, delay);
      } else {
        // Typing complete
        cursor.style.display = "none";

        // Add final flourish
        const heart = document.createElement('span');
        heart.innerHTML = ' 💖';
        heart.className = 'handwritten text-2xl';
        heart.style.opacity = '0';
        heart.style.transition = 'opacity 0.5s ease-in';
        typedText.appendChild(heart);
        setTimeout(() => heart.style.opacity = '1', 500);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      prepareText();
      setTimeout(typeNextChar, 1000); // Initial delay before typing starts
    });
  </script>

</body>

</html>
